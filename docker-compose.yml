services:
  postgres:
    image: postgres:18-alpine
    container_name: book_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-book_postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-book_password}
      POSTGRES_DB: ${DB_NAME:-book_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - book_network

volumes:
  postgres_data:

networks:
  book_network:
    driver: bridge
